[package]
name = "pallet-xode-asset-vesting"
description = "FRAME pallet for graded vesting of local assets, freezing the unvested balance."
version = "0.1.0"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-support.workspace = true
frame-system.workspace = true
sp-runtime.workspace = true
# Only for the shared `VestingSchedule` type, so both vesting pallets use the same schedules.
orml-vesting.workspace = true

[dev-dependencies]
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
pallet-assets = { default-features = true, workspace = true }
pallet-assets-freezer = { default-features = true, workspace = true }
pallet-balances = { default-features = true, workspace = true }

[features]
default = ["std"]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"orml-vesting/runtime-benchmarks",
	"pallet-assets/runtime-benchmarks",
	"pallet-assets-freezer/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
]
std = [
	"codec/std",
	"scale-info/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"sp-runtime/std",
	"orml-vesting/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
	"orml-vesting/try-runtime",
]
